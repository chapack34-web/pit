<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Pit — Mensajería real</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3ddc97" />
<link rel="icon" href="/icon.svg" />
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  :root {
    --bg:#0b0f14; --card:#131a22; --card2:#1a232d; --accent:#3ddc97; --accent-dim:#2a9d6f;
    --text:#e8f0f2; --muted:#7a8a94; --danger:#ff5c5c; --radius:16px;
  }
  [data-theme="light"] {
    --bg:#f4f7f6; --card:#ffffff; --card2:#eef2f1; --text:#0b0f14; --muted:#5a6a72;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg);
    color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;
    transition:background .2s, color .2s;
  }
  #login {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:14px; padding:24px; text-align:center;
  }
  .logo { width:72px; height:72px; border-radius:20px; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; color:#04140d; margin-bottom:8px; box-shadow:0 8px 30px rgba(61,220,151,.35); }
  h1 { font-size:26px; margin:0; letter-spacing:-0.5px; }
  .tagline { color:var(--muted); font-size:14px; max-width:300px; margin:0 0 12px; }
  #login input {
    padding:15px 16px; border-radius:14px; border:1px solid rgba(122,138,148,.25);
    background:var(--card); color:var(--text); font-size:16px; width:100%; max-width:320px; outline:none;
  }
  #login input:focus { border-color:var(--accent); }
  .btn {
    background:var(--accent); color:#04140d; border:none; border-radius:14px;
    padding:15px 22px; font-weight:700; font-size:16px; cursor:pointer; width:100%; max-width:320px;
    transition:transform .1s, opacity .2s;
  }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.5; }
  #loginMsg { color:var(--muted); font-size:13px; min-height:18px; }
  .badge-realtime { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--accent); background:rgba(61,220,151,.12); padding:6px 12px; border-radius:20px; margin-top:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #app { display:none; flex-direction:column; height:100%; }
  header.topbar {
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    background:var(--card); border-bottom:1px solid rgba(122,138,148,.12);
  }
  header.topbar .title { font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; }
  .icon-btn { background:none; border:none; color:var(--text); font-size:18px; cursor:pointer; padding:8px; border-radius:10px; }
  .icon-btn:hover { background:var(--card2); }

  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .msg-row { display:flex; flex-direction:column; max-width:78%; }
  .msg-row.mine { align-self:flex-end; align-items:flex-end; }
  .bubble {
    padding:11px 15px; border-radius:18px; background:var(--card); position:relative;
    word-wrap:break-word; font-size:15px; line-height:1.4; box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .mine .bubble { background:var(--accent); color:#04140d; border-bottom-right-radius:6px; }
  .msg-row:not(.mine) .bubble { border-bottom-left-radius:6px; }
  .meta-row { display:flex; gap:6px; align-items:center; margin-top:3px; font-size:11px; color:var(--muted); }
  .edited-tag { font-style:italic; opacity:.7; }
  .reactions-row { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
  .reaction-chip { background:var(--card2); border-radius:12px; padding:2px 8px; font-size:12px; }
  .msg-actions { display:none; gap:4px; margin-top:4px; }
  .msg-row:hover .msg-actions { display:flex; }
  .msg-actions button { background:var(--card2); border:none; color:var(--muted); font-size:11px; padding:4px 8px; border-radius:8px; cursor:pointer; }

  #typingIndicator { padding:0 16px 6px; font-size:12px; color:var(--accent); min-height:16px; }

  #composer { display:flex; gap:8px; padding:12px; background:var(--card); align-items:flex-end; }
  #composer textarea {
    flex:1; padding:13px 16px; border-radius:20px; border:none; background:var(--card2);
    color:var(--text); font-size:15px; resize:none; max-height:100px; font-family:inherit; outline:none;
  }
  #composer button.send {
    background:var(--accent); color:#04140d; border:none; width:46px; height:46px; border-radius:50%;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }
  #composer button.icon { background:var(--card2); border:none; width:46px; height:46px; border-radius:50%; color:var(--text); font-size:16px; cursor:pointer; flex-shrink:0; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; align-items:flex-end; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:80vh; overflow-y:auto; position:relative; }
  .modal h3 { margin-top:0; }
  .modal input { width:100%; padding:13px; border-radius:12px; border:1px solid rgba(122,138,148,.25); background:var(--card2); color:var(--text); margin-bottom:10px; font-size:15px; }
  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .emoji-chip { font-size:22px; background:var(--card2); border:none; border-radius:12px; padding:6px 10px; cursor:pointer; }
  .close-modal { position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
</style>
</head>
<body data-theme="dark">

  <div id="login">
    <div class="logo">P</div>
    <h1>Pit</h1>
    <p class="tagline">Mensajería cifrada de verdad. Rápida, simple, sin instalar nada.</p>
    <input id="serverInput" placeholder="Servidor: https://tudominio.com" />
    <input id="phoneInput" placeholder="Tu número, ej +5490000000" />
    <input id="passInput" type="password" placeholder="Contraseña" />
    <input id="nameInput" placeholder="Tu nombre (solo primera vez)" />
    <button class="btn" onclick="loginFlow()" id="loginBtn">Entrar a Pit</button>
    <p id="loginMsg"></p>
    <div class="badge-realtime"><span class="dot"></span> Conexión cifrada de extremo a extremo</div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="title">💬 <span id="chatTitle">Pit</span></div>
      <div>
        <button class="icon-btn" onclick="toggleTheme()" title="Cambiar tema">🌓</button>
        <button class="icon-btn" onclick="openModal('searchModal')" title="Buscar">🔎</button>
        <button class="icon-btn" onclick="openModal('profileModal')" title="Perfil">👤</button>
      </div>
    </header>

    <div id="messages"></div>
    <div id="typingIndicator"></div>

    <div id="composer">
      <button class="icon" onclick="openModal('ephemeralModal')" title="Mensaje que se autodestruye">⏱️</button>
      <textarea id="msgInput" placeholder="Escribí un mensaje..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send" onclick="send()">➤</button>
    </div>
  </div>

  <div class="modal-overlay" id="chatModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('chatModal')">✕</button>
      <h3>Entrar a un chat</h3>
      <input id="chatIdInput" placeholder="ID de chat existente" />
      <button class="btn" onclick="joinChat()">Entrar</button>
    </div>
  </div>

  <div class="modal-overlay" id="searchModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('searchModal')">✕</button>
      <h3>Buscar en este chat</h3>
      <input id="searchInput" placeholder="Escribí para buscar..." onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="btn" onclick="doSearch()">Buscar</button>
      <div id="searchResults"></div>
    </div>
  </div>

  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('profileModal')">✕</button>
      <h3>Tu perfil</h3>
      <input id="profileName" placeholder="Nombre" />
      <input id="profileBio" placeholder="Bio" />
      <button class="btn" onclick="saveProfile()">Guardar</button>
    </div>
  </div>

  <div class="modal-overlay" id="ephemeralModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('ephemeralModal')">✕</button>
      <h3>Mensaje que se autodestruye ⏱️</h3>
      <input id="ephemeralContent" placeholder="Tu mensaje" />
      <div class="chip-row">
        <button class="emoji-chip" style="font-size:14px" onclick="sendEphemeral(10)">10s</button>
        <button class="emoji-chip" style="font-size:14px" onclick="sendEphemeral(60)">1 min</button>
        <button class="emoji-chip" style="font-size:14px" onclick="sendEphemeral(3600)">1 hora</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reactModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('reactModal')">✕</button>
      <h3>Reaccionar</h3>
      <div class="chip-row">
        <button class="emoji-chip" onclick="reactTo('❤️')">❤️</button>
        <button class="emoji-chip" onclick="reactTo('😂')">😂</button>
        <button class="emoji-chip" onclick="reactTo('😮')">😮</button>
        <button class="emoji-chip" onclick="reactTo('👍')">👍</button>
        <button class="emoji-chip" onclick="reactTo('🔥')">🔥</button>
      </div>
    </div>
  </div>

<script>
  let SERVER = '', token = '', myUserId = '', socket = null, currentChatId = '';
  let reactingToMessageId = null;
  const messagesById = {};

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  function toggleTheme() {
    const body = document.body;
    const next = body.dataset.theme === 'dark' ? 'light' : 'dark';
    body.dataset.theme = next;
    localStorage.setItem('pit-theme', next);
  }
  document.body.dataset.theme = localStorage.getItem('pit-theme') || 'dark';

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  async function loginFlow() {
    SERVER = document.getElementById('serverInput').value.replace(/\/$/, '');
    const phone = document.getElementById('phoneInput').value.trim();
    const password = document.getElementById('passInput').value;
    const name = document.getElementById('nameInput').value.trim();
    const msgEl = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');

    if (!SERVER || !phone || !password) { msgEl.textContent = 'Completá servidor, teléfono y contraseña.'; return; }
    btn.disabled = true;
    try {
      msgEl.textContent = 'Pidiendo código...';
      const otpResp = await fetch(`${SERVER}/api/auth/otp/request`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone })
      }).then(r => r.json());

      let otp = otpResp.devOtp || prompt('Ingresá el código OTP que te llegó por SMS:');

      const authResp = await fetch(`${SERVER}/api/auth/otp/verify`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phone, otp, name, password })
      }).then(r => r.json());

      if (authResp.error) { msgEl.textContent = authResp.error; btn.disabled = false; return; }

      token = authResp.token;
      myUserId = authResp.user.id;
      connectSocket();
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      openModal('chatModal');
    } catch (e) {
      msgEl.textContent = 'Error de conexión: ' + e.message;
      btn.disabled = false;
    }
  }

  function connectSocket() {
    socket = io(SERVER, { auth: { token } });
    socket.on('new_message', renderMessage);
    socket.on('message_edited', (msg) => updateMessageEl(msg));
    socket.on('message_deleted', ({ id }) => { const el = document.getElementById('m_'+id); if (el) el.remove(); });
    socket.on('reaction_update', ({ messageId, reactions }) => renderReactions(messageId, reactions));
    socket.on('user_typing', () => {
      document.getElementById('typingIndicator').textContent = 'escribiendo...';
      clearTimeout(window._typingTimeout);
      window._typingTimeout = setTimeout(() => { document.getElementById('typingIndicator').textContent = ''; }, 2000);
    });
  }

  async function joinChat() {
    currentChatId = document.getElementById('chatIdInput').value.trim();
    if (!currentChatId) return;
    socket.emit('join_room', currentChatId);
    document.getElementById('chatTitle').textContent = 'Chat: ' + currentChatId;
    document.getElementById('messages').innerHTML = '';
    const history = await fetch(`${SERVER}/api/chat/${currentChatId}/history`, {
      headers: { Authorization: `Bearer ${token}` }
    }).then(r => r.json());
    if (Array.isArray(history)) history.forEach(renderMessage);
    closeModal('chatModal');
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    else socket?.emit('typing', { chatId: currentChatId, userId: myUserId });
  }

  async function send() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !currentChatId) return;
    await fetch(`${SERVER}/api/chat/send`, {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ chatId: currentChatId, content })
    });
    input.value = '';
  }

  async function sendEphemeral(ttlSeconds) {
    const content = document.getElementById('ephemeralContent').value.trim();
    if (!content || !currentChatId) return;
    await fetch(`${SERVER}/api/chat/ephemeral`, {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ chatId: currentChatId, content, ttlSeconds })
    });
    document.getElementById('ephemeralContent').value = '';
    closeModal('ephemeralModal');
  }

  function renderMessage(msg) {
    messagesById[msg.id] = msg;
    const row = document.createElement('div');
    row.className = 'msg-row' + (msg.senderId === myUserId ? ' mine' : '');
    row.id = 'm_' + msg.id;
    row.innerHTML = `
      <div class="bubble">${escapeHtml(msg.content)}</div>
      <div class="meta-row">
        ${msg.isEdited ? '<span class="edited-tag">editado</span>' : ''}
        ${msg.isEphemeral ? '⏱️' : ''}
        ${msg.forwardedFrom ? '↪️ reenviado' : ''}
      </div>
      <div class="reactions-row" id="react_${msg.id}"></div>
      <div class="msg-actions">
        <button onclick="openReact('${msg.id}')">😊</button>
        ${msg.senderId === myUserId ? `<button onclick="editMsg('${msg.id}')">Editar</button>` : ''}
        <button onclick="forwardMsg('${msg.id}')">Reenviar</button>
      </div>
    `;
    document.getElementById('messages').appendChild(row);
    row.scrollIntoView();
  }

  function updateMessageEl(msg) {
    messagesById[msg.id] = msg;
    const el = document.getElementById('m_' + msg.id);
    if (el) el.querySelector('.bubble').textContent = msg.content;
  }

  function renderReactions(messageId, reactions) {
    const el = document.getElementById('react_' + messageId);
    if (!el) return;
    const counts = {};
    reactions.forEach(r => counts[r.emoji] = (counts[r.emoji] || 0) + 1);
    el.innerHTML = Object.entries(counts).map(([emoji, count]) =>
      `<span class="reaction-chip">${emoji} ${count}</span>`
    ).join('');
  }

  function openReact(messageId) { reactingToMessageId = messageId; openModal('reactModal'); }
  async function reactTo(emoji) {
    if (!reactingToMessageId) return;
    await fetch(`${SERVER}/api/reaction/${reactingToMessageId}`, {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ emoji })
    });
    closeModal('reactModal');
  }

  async function editMsg(id) {
    const current = messagesById[id]?.content || '';
    const content = prompt('Editar mensaje:', current);
    if (content === null || content === current) return;
    await fetch(`${SERVER}/api/chat/message/${id}`, {
      method:'PUT', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ content })
    });
  }

  async function forwardMsg(id) {
    const toChatId = prompt('¿A qué chat reenviar? (ID)');
    if (!toChatId) return;
    await fetch(`${SERVER}/api/chat/forward/${id}`, {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ toChatId })
    });
    alert('Reenviado ✅');
  }

  async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q || !currentChatId) return;
    const results = await fetch(`${SERVER}/api/chat/${currentChatId}/search?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: `Bearer ${token}` }
    }).then(r => r.json());
    document.getElementById('searchResults').innerHTML = (results || []).map(m =>
      `<div style="text-align:left; padding:8px; background:var(--card2); border-radius:10px; margin-top:6px; font-size:14px;">${escapeHtml(m.content)}</div>`
    ).join('') || '<p style="color:var(--muted)">Sin resultados</p>';
  }

  async function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    const bio = document.getElementById('profileBio').value.trim();
    await fetch(`${SERVER}/api/user/me`, {
      method:'PUT', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify({ name, bio })
    });
    closeModal('profileModal');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
